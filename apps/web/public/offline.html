<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline · Dua Medical HMS</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #0f766e; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p>Dua Medical HMS needs an internet connection to show live patient and hospital data. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
