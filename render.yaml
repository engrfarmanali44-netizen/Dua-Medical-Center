# Render Blueprint for the Dua Medical HMS API (FastAPI).
# Render > New > Blueprint > pick this GitHub repo. Secrets marked `sync: false` are typed in
# the Render dashboard (never commit them).
services:
  - type: web
    name: dua-medical-api
    runtime: python
    region: singapore          # closest Render region to Pakistan and to the Supabase database
    plan: free                 # free sleeps after 15 min idle (first request then takes ~1 min); "starter" stays awake
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Every deploy: bring the database up to date, sync roles/permissions (no demo data), start the API.
    startCommand: alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DB_URL       # Supabase > Connect > Session pooler URI (with the password)
        sync: false
      - key: SUPABASE_URL          # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SECRET_KEY   # sb_secret_... (server only)
        sync: false
      - key: CORS_ORIGINS          # your Vercel address, e.g. https://dua-medical-center.vercel.app
        sync: false
